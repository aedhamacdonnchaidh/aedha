<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aedha</title>
    <style>
        /* Base page theme settings */
        body {
            background-color: #000000; 
            color: #ffffff;            
            font-family: sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
            overflow-x: hidden;
        }

        /* --- Full-Screen Background Asset Wrappers --- */
        .bg-video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2; 
            overflow: hidden;
            opacity: 1;  
            transition: opacity 2s ease-in-out;
        }

        .loop-animation-asset {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

        .bg-image-replacement {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;  
            opacity: 0;   
            transition: opacity 2s ease-in-out;
        }

        /* Quiz Container Styling */
        .puzzle-box {
            position: relative;
            z-index: 2; 
            max-width: 480px;
            margin: 40px auto 30px auto;
            padding: 25px;
            border: 2px solid #ffffff; 
            background-color: rgba(17, 17, 17, 0.85); 
            transition: opacity 1s ease-in-out;
        }

        .puzzle-stage {
            display: none; 
        }

        .puzzle-title {
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* Button Action Styling */
        .option-button {
            display: block;
            width: 100%;
            max-width: 260px;
            margin: 10px auto;
            padding: 12px;
            background-color: #ffffff; 
            color: #000000;
            border: 1px solid #ffffff;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-button:hover {
            background-color: #000000;
            color: #ffffff;
        }

        /* Direct Input Web Form Box (Appears upon win) */
        .contact-form-box {
            display: none;
            position: relative;
            z-index: 3;
            max-width: 400px;
            margin: 40px auto;
            padding: 30px;
            border: 2px dashed #ffffff;
            background-color: rgba(0, 0, 0, 0.9);
        }

        .contact-input {
            width: 80%;
            padding: 12px;
            margin: 15px 0;
            background-color: #111111;
            border: 1px solid #ffffff;
            color: #ffffff;
            text-align: center;
            font-size: 16px;
        }

        .contact-input:focus {
            outline: 2px solid #ffffff;
        }

        /* Shaking Feedback Error Mechanics */
        .shake-sequence {
            animation: shakeFrames 0.3s ease-in-out;
        }

        @keyframes shakeFrames {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
    </style>
</head>
<body>

    <!-- AUDIO SETUP OPTION -->
    <audio id="successAudio" src="fate.mp3"></audio>

    <!-- FULL-SCREEN BACKGROUND VIDEO LAYER CONTAINER -->
    <div class="bg-video-container" id="videoBackground">
        <video autoplay loop muted playsinline class="loop-animation-asset">
            <source src="0001-0120.mp4" type="video/mp4">
            Media element playback failed to launch.
        </video>
    </div>

    <!-- Replacement Background Image Asset Frame -->
    <img src="freed.jpg" alt="Revelation" class="bg-image-replacement" id="imageBackground">

    <!-- THE 3-STAGE PROGRESSION QUIZ BOX -->
    <div class="puzzle-box" id="quizContainer">
        <!-- Stage One Panel -->
        <div class="puzzle-stage" id="gate1" style="display: block;">
            <div class="puzzle-title">Tpnf usz up ijef, tpnf usz up difbu; cvu ujnf xjmm tipx, xf bmxbzt xjmm nffu.</div>
            <button class="option-button" onclick="failChoice()">Ifbwfo</button>
            <button class="option-button" onclick="nextStage(1, 2)">Efbui</button>
            <button class="option-button" onclick="failChoice()">Uif Tlz</button>
        </div>

        <!-- Stage Two Panel -->
        <div class="puzzle-stage" id="gate2">
            <div class="puzzle-title">J bn nbo’t pmeftu tibepx, zfu J xbml po gpvs mfht jotufbe pg uxp</div>
            <button class="option-button" onclick="nextStage(2, 3)">Eph</button>
            <button class="option-button" onclick="failChoice()">B tibepx</button>
        </div>

        <!-- Stage Three Panel -->
        <div class="puzzle-stage" id="gate3">
            <div class="puzzle-title">J tjoh xjuipvu c tjohmf mzsjd. Nz cpoft bsf gjmmfe xjui cjs jotufbe pg nbsspx. J tpbs pwfs uif gpsftu.</div>
            <button class="option-button" onclick="failChoice()">Xjoe</button>
            <button class="option-button" onclick="failChoice()">Usfft</button>
            <button class="option-button" onclick="nextStage(3, 'unlocked')">Cjse</button>
        </div>

        <!-- Final Resolution Banner -->
        <div class="puzzle-stage" id="gate-unlocked">
            <div class="puzzle-title" style="margin: 0; color: #ffffff;">Quest Complete. Aedha has been freed.</div>
        </div>
    </div>

    <!-- FIXED UNIVERSAL WEB FORM SETUP -->
    <div class="contact-form-box" id="submissionBox">
        <div class="puzzle-title">Email me again.</div>
        
        <!-- Formspree processing link completely bypasses standard browser/desktop mail handling rules -->
        <form action="https://formspree.io/f/xbglqoaz" method="POST">
            <!-- Cryptic hidden baseline parameters to auto-fill custom subject text details inside your inbox dashboard -->
            <input type="hidden" name="_subject" value="Uif Effs Xbudift">
            <input type="hidden" name="Message Body" value="Aedha is free.">
            
            <input type="email" name="email" class="contact-input" placeholder="ENTER YOUR EMAIL ADDRESS" required>
            <br>
            <input type="submit" class="option-button" value="SEND TRANSMISSION">
        </form>
    </div>

    <!-- RUNTIME APP INTERACTION SCRIPTS -->
    <script>
        function nextStage(currentStageNum, nextStageNum) {
            document.getElementById('gate' + currentStageNum).style.display = 'none';
            
            if (nextStageNum === 'unlocked') {
                document.getElementById('quizContainer').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('quizContainer').style.display = 'none';
                    document.getElementById('submissionBox').style.display = 'block';
                }, 1000);
                
                document.getElementById('videoBackground').style.opacity = '0';
                document.getElementById('imageBackground').style.opacity = '1';
                
                const audio = document.getElementById('successAudio');
                audio.play().catch(error => {
                    console.log("Audio autoplay restriction handled gracefully.", error);
                });
            } else {
                document.getElementById('gate' + currentStageNum).style.display = 'none';
                document.getElementById('gate' + nextStageNum).style.display = 'block';
            }
        }

        function failChoice() {
            const layoutBox = document.getElementById('quizContainer');
            layoutBox.classList.add('shake-sequence');
            
            setTimeout(() => {
                layoutBox.classList.remove('shake-sequence');
            }, 300);
        }
    </script>

</body>
</html>
